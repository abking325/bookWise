name: Build BookWise Offline APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflow:
    name: Validate Workflow with actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

  build-debug-apk:
    name: Test and Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java 21 environment
        run: |
          mkdir -p build-diagnostics
          {
            echo "=== JAVA_HOME ==="
            echo "${JAVA_HOME:-unset}"
            echo "=== java -version ==="
            java -version 2>&1
            echo "=== javac -version ==="
            javac -version 2>&1
          } | tee build-diagnostics/environment.txt
          if ! java -version 2>&1 | grep -qE 'version "21\.'; then
            echo "ERROR: Expected Java 21 runtime, found:"
            java -version 2>&1
            exit 1
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 36.1 and Build Tools
        run: |
          { yes || true; } | sdkmanager --licenses >/dev/null
          { yes || true; } | sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android SDK installation
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for required_dir in "$SDK_DIR/platforms/android-36.1" "$SDK_DIR/platforms/android-36" "$SDK_DIR/build-tools/36.0.0"; do
            if [ ! -d "$required_dir" ]; then
              echo "ERROR: Required Android SDK directory missing: $required_dir"
              exit 1
            fi
          done
          {
            echo "=== ANDROID SDK ($SDK_DIR) ==="
            sdkmanager --list_installed
          } | tee -a build-diagnostics/environment.txt

      - name: Cache Robolectric Android runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-robolectric-m2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-m2-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: |
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing Gradle wrapper file: $f"
              exit 1
            fi
          done
          if ! grep -q 'gradle-9\.3\.1-bin\.zip' gradle/wrapper/gradle-wrapper.properties; then
            echo "ERROR: gradle-wrapper.properties is not configured for Gradle 9.3.1"
            cat gradle/wrapper/gradle-wrapper.properties
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --version | tee -a build-diagnostics/environment.txt
          if ! ./gradlew --version | grep -q 'Gradle 9\.3\.1'; then
            echo "ERROR: Expected Gradle 9.3.1"
            exit 1
          fi
          if ! ./gradlew --version | grep -qE 'Launcher JVM:[[:space:]]+21\.'; then
            echo "ERROR: Gradle wrapper is not running on Java 21"
            exit 1
          fi

      - name: Configure consistent debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias name|Owner|SHA256"

      - name: Clean build workspace
        run: ./gradlew clean --stacktrace

      - name: Run all existing unit and Robolectric tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --info 2>&1 | tee build-diagnostics/test-run.log

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-diagnostics/assemble-debug.log

      - name: Verify APK signature, metadata, integrity, and checksum
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected non-empty APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" BookWise-Offline.apk

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: Android SDK build-tools directory not found"
            exit 1
          fi

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          if [ ! -x "$APKSIGNER" ] || [ ! -x "$AAPT2" ] || [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: Required Android build-tools binaries missing in $BUILD_TOOLS_DIR"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs BookWise-Offline.apk | tee build-diagnostics/apksigner.txt
          "$AAPT2" dump badging BookWise-Offline.apk | tee build-diagnostics/aapt2-badging.txt | head -n 35
          "$ZIPALIGN" -c -v 4 BookWise-Offline.apk | tail -n 5
          unzip -tq BookWise-Offline.apk
          sha256sum BookWise-Offline.apk | tee BookWise-Offline.apk.sha256
          ls -lh BookWise-Offline.apk

          {
            echo "## BookWise Offline Debug APK"
            echo ""
            echo "- File: \`BookWise-Offline.apk\`"
            echo "- Size: \`$(stat -c%s BookWise-Offline.apk) bytes\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 BookWise-Offline.apk.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect test and build diagnostics
        if: always()
        run: |
          mkdir -p build-diagnostics
          python3 - <<'PY' | tee build-diagnostics/test-summary.txt
          import glob, xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              print("No XML test result files found.")
          else:
              total = failures = errors = skipped = 0
              for path in files:
                  root = ET.parse(path).getroot()
                  t = int(root.attrib.get("tests", 0))
                  f = int(root.attrib.get("failures", 0))
                  e = int(root.attrib.get("errors", 0))
                  s = int(root.attrib.get("skipped", 0))
                  total += t
                  failures += f
                  errors += e
                  skipped += s
                  print(f"{root.attrib.get('name', path)}: tests={t}, failures={f}, errors={e}, skipped={s}")
                  for tc in root.findall("testcase"):
                      for tag in ("failure", "error"):
                          elem = tc.find(tag)
                          if elem is not None:
                              print(f"  FAILED: {tc.attrib.get('classname')}.{tc.attrib.get('name')} -> {elem.attrib.get('message', '')}")
                              if elem.text:
                                  print(elem.text.strip())
              print(f"TOTAL: tests={total}, failures={failures}, errors={errors}, skipped={skipped}")
          PY

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-diagnostics/
            app/build/test-results/
            app/build/reports/
            BookWise-Offline.apk.sha256
          if-no-files-found: ignore

      - name: Upload BookWise-Offline.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookWise-Offline.apk
          path: BookWise-Offline.apk
          if-no-files-found: error
