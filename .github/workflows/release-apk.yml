name: Release Signed BookWise Offline APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java 21 environment
        run: |
          mkdir -p build-diagnostics
          {
            echo "=== JAVA_HOME ==="
            echo "${JAVA_HOME:-unset}"
            java -version 2>&1
            javac -version 2>&1
          } | tee build-diagnostics/environment.txt
          if ! java -version 2>&1 | grep -qE 'version "21\.'; then
            echo "ERROR: Expected Java 21 runtime"
            exit 1
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 36.1 and Build Tools
        run: |
          { yes || true; } | sdkmanager --licenses >/dev/null
          { yes || true; } | sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android SDK installation
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for required_dir in "$SDK_DIR/platforms/android-36.1" "$SDK_DIR/platforms/android-36" "$SDK_DIR/build-tools/36.0.0"; do
            if [ ! -d "$required_dir" ]; then
              echo "ERROR: Required Android SDK directory missing: $required_dir"
              exit 1
            fi
          done

      - name: Cache Robolectric Android runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-robolectric-m2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-m2-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: |
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing Gradle wrapper file: $f"
              exit 1
            fi
          done
          chmod +x gradlew
          ./gradlew --version | tee -a build-diagnostics/environment.txt
          if ! ./gradlew --version | grep -q 'Gradle 9\.3\.1'; then
            echo "ERROR: Expected Gradle 9.3.1"
            exit 1
          fi
          if ! ./gradlew --version | grep -qE 'Launcher JVM:[[:space:]]+21\.'; then
            echo "ERROR: Gradle wrapper is not running on Java 21"
            exit 1
          fi

      - name: Build and verify signed release APK when secrets are configured
        id: release_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Production signing secrets are not configured; skipping release signing."
            echo "apk_built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          ./gradlew clean --stacktrace
          ./gradlew :app:testDebugUnitTest --stacktrace --info 2>&1 | tee build-diagnostics/release-test-run.log
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-diagnostics/assemble-release.log
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RELEASE_APK" ]; then
            echo "ERROR: Expected non-empty release APK not found at $RELEASE_APK"
            exit 1
          fi
          cp "$RELEASE_APK" BookWise-Offline-release.apk

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs BookWise-Offline-release.apk
          "$BUILD_TOOLS_DIR/aapt2" dump badging BookWise-Offline-release.apk | head -n 35
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 BookWise-Offline-release.apk | tail -n 5
          unzip -tq BookWise-Offline-release.apk
          sha256sum BookWise-Offline-release.apk | tee BookWise-Offline-release.apk.sha256
          echo "apk_built=true" >> "$GITHUB_OUTPUT"

      - name: Upload release diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            build-diagnostics/
            app/build/test-results/
            app/build/reports/
            BookWise-Offline-release.apk.sha256
          if-no-files-found: ignore

      - name: Upload Signed Release APK Artifact
        if: steps.release_build.outputs.apk_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BookWise-Offline-release.apk
          path: BookWise-Offline-release.apk
          if-no-files-found: error

      - name: Publish Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_build.outputs.apk_built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: BookWise-Offline-release.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
